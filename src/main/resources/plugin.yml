name: Oathbound
version: '${version}'
main: com.google.gmail.philbgarner.oathbound.OathboundPlugin
api-version: '26.2'
author: philbgarner
description: Diegetic, mechanically-binding agreements between players.
softdepend: [WorldGuard]
commands:
  oathbound-debug:
    description: Oathbound Phase 1 debug/testing commands.
    usage: /<command> <subcommand> [args...]
    permission: oathbound.debug
  oathbound-trade:
    description: Open the Oathbound trade contract builder or board.
    usage: /<command> [board]
  oathbound-oath:
    description: Build and propose a named-party oath, review oaths proposed to you, or claim escrow.
    usage: /<command> <create <playerName> [blood]|pending|claim>
  oathbound-group:
    description: Found a Company, Town, Region, or Kingdom - the only player-facing way to create a
      ProtectionGroup, needed before a chest or door can be locked to it - or link one to a WorldGuard
      region, if WorldGuard is installed.
    usage: /<command> <create <name> [tier]|link-region <groupId> <regionId>>
  oathbound-armorer:
    description: Install an invulnerable, rooted Armorer villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-butcher:
    description: Install an invulnerable, rooted Butcher villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-cartographer:
    description: Install an invulnerable, rooted Cartographer villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-cleric:
    description: Install an invulnerable, rooted Cleric villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-farmer:
    description: Install an invulnerable, rooted Farmer villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-fisherman:
    description: Install an invulnerable, rooted Fisherman villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-fletcher:
    description: Install an invulnerable, rooted Fletcher villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-leatherworker:
    description: Install an invulnerable, rooted Leatherworker villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-librarian:
    description: Install an invulnerable, rooted Librarian villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-mason:
    description: Install an invulnerable, rooted Mason villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-shepherd:
    description: Install an invulnerable, rooted Shepherd villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-toolsmith:
    description: Install an invulnerable, rooted Toolsmith villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
  oathbound-weaponsmith:
    description: Install an invulnerable, rooted Weaponsmith villager (vanilla trades) at your current location.
    usage: /<command> install <name...>
permissions:
  oathbound.debug:
    description: Access to Oathbound's Phase 1 debug/testing command surface (/oathbound-debug) - group
      transfer, honor adjust, arbitrary oath construction, and every other admin/testing-only action that
      doesn't have a player-facing UI yet.
    default: op
