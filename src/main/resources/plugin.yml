name: Oathbound
version: '${version}'
main: com.google.gmail.philbgarner.oathbound.OathboundPlugin
api-version: '26.2'
author: philbgarner
description: Diegetic, mechanically-binding agreements between players.
commands:
  oathbound-debug:
    description: Oathbound Phase 1 debug/testing commands.
    usage: /<command> <subcommand> [args...]
  oathbound-trade:
    description: Open the Oathbound trade contract builder or board.
    usage: /<command> [board]
  oathbound-oath:
    description: Build and propose a named-party oath, review oaths proposed to you, or claim escrow.
    usage: /<command> <create <playerName> [blood]|pending|claim>
  oathbound-notary:
    description: Install a Notary NPC at your current location.
    usage: /<command> install <name...>
  oathbound-armorer:
    description: Install an Armorer shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-butcher:
    description: Install a Butcher shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-cartographer:
    description: Install a Cartographer shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-cleric:
    description: Install a Cleric shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-farmer:
