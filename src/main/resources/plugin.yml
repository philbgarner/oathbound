    usage: /<command> install <name...>
  oathbound-fisherman:
    description: Install a Fisherman shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-fletcher:
    description: Install a Fletcher shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-leatherworker:
    description: Install a Leatherworker shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-librarian:
    description: Install a Librarian shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-mason:
    description: Install a Mason shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-shepherd:
    description: Install a Shepherd shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-toolsmith:
    description: Install a Toolsmith shop NPC at your current location.
    usage: /<command> install <name...>
  oathbound-weaponsmith:
    description: Install a Weaponsmith shop NPC at your current location.
