# Oathbound configuration

persistence:
  # Path to the SQLite database file, relative to the plugin's data folder.
  sqlite-file: oathbound.db

ownership:
  # Max hops to walk when resolving a ProtectionGroup's owner chain before
  # failing safe and flagging the chain as unresolved.
  resolver-depth-cutoff: 10

economy:
  # Named currencies available on this server. The first entry is the default.
  currencies:
    - coin

escrow:
  # Days an escrow release sits unclaimed before it's returned to the depositor instead of the
  # recipient. Currency releases are unaffected - only unclaimed items expire.
  claim-expiry-days: 30

altar:
  # Block required directly on top of the barrel, with a candle placed on top of that, to
  # consecrate an altar. Placing the candle is what triggers altar creation.
  capstone-material: OBSIDIAN
  # Radius (in blocks) = power-radius-scale * tier-multiplier * sqrt(current Power).
  power-radius-scale: 4.0
  tier-radius-multiplier:
    INDIVIDUAL: 1.0
    COMPANY: 1.25
    TOWN: 1.5
    REGION: 2.0
    KINGDOM: 3.0
  # Days of neglect for an altar's Power to decay from its last-sacrifice baseline down to zero. Each
  # altar's own most recent top-up total is its own "full" - this is a flat rate, not tied to a global
  # power cap.
  decay-days: 5
  # At or below this live Power, an altar is Critical: protection radius drops to zero and the barrel
  # becomes interactable for a Destroy (desecration) or Loot outcome.
  critical-threshold: 10
  # At or below this live Power (but above critical-threshold), an altar is Decaying: still fully
  # protected, but the owner gets a login warning.
  decaying-threshold: 100
  # Power a freshly-consecrated altar starts with - a one-time grace baseline, not a real sacrifice
  # (it decays on the normal clock like any other Power, and can't be Looted for XP). Default is
  # comfortably above decaying-threshold so a brand-new altar reads Normal, not Critical, from the
  # moment it's placed - a new owner has a real window to sacrifice something before protection lapses.
  # Set to 0 to restore the old zero-grace behavior.
  starting-power: 150
  # XP orbs dropped when looting a Critical altar's barrel = this * the value of the most recent
  # completed sacrifice (not lifetime total).
  xp-loot-conversion-rate: 1.0
  # Seconds after any successful top-up (recovering from Critical, or a fresh post-desecration
  # reconsecration) before protection re-engages, even if Power already reads as sufficient.
  reconsecration-cooldown-seconds: 300
  # Sacrifice valuation: an enchantment's base weight = this scale divided by its max level, so maxing
  # out any single enchantment is worth the same as maxing out any other enchantment OF THE SAME
  # RARITY, regardless of item type or how many levels it has - see enchantment-rarity-multiplier below
  # for how rarity then scales that ceiling further.
  enchantment-weight-scale: 10.0
  # Each repeated occurrence of the same enchantment type within one sacrifice batch is multiplied by
  # this factor (compounding), to discourage volume-stuffing many low-value items in one deposit.
  repeat-enchantment-decay: 0.5
  # Multiplies an enchantment's normalized weight by how significant Bukkit itself considers it
  # (Enchantment.getRarity()) - a maxed-out enchantment is worth enchantment-weight-scale * this
  # multiplier, so a rare/powerful enchantment is worth more than a common one even when both are
  # equally "maxed out" by the level-normalization above. Keys are COMMON/UNCOMMON/RARE/VERY_RARE.
  enchantment-rarity-multiplier:
    COMMON: 1.0
    UNCOMMON: 1.5
    RARE: 2.5
    VERY_RARE: 4.0
  # Honor penalty applied to whoever destroys a Critical altar's barrel (a Desecration).
  desecration-honor-penalty: 50
  # Honor penalty applied to whoever loots (rather than destroys) a Critical altar's barrel. Zero by
  # default - looting isn't punished unless a server admin wants to discourage even that.
  loot-honor-penalty: 0

protection:
  # Item that must be held to lock/unlock a chest or door - right-click the block while holding
  # this item to open the group picker. Any other item (or empty hand) is a normal interaction,
  # gated by whatever ProtectionGroup the block is already locked to (if any).
  lock-tool-material: TRIPWIRE_HOOK

honor:
  # Honor gained by every party when an oath resolves FULFILLED, before severity/blood-oath scaling.
  fulfill-gain-base: 10
  # Honor lost by every party when an oath resolves BROKEN, before scaling. Kept larger than
  # fulfill-gain-base by default so breaking an oath stings more than fulfilling one rewards.
  breach-loss-base: 20
  # Both gain and loss are multiplied by this for Blood Oaths - "Blood Oaths matter more," both ways.
  blood-oath-multiplier: 2.0
  # Minimum current Honor required to swear a new Blood Oath. Default 0 only blocks players who've
  # already gone Honor-negative (i.e. broken oaths before) - a fresh player at 0 Honor is unaffected.
  min-honor-for-blood-oath: 0
  # Cosmetic title ladder, keyed by the minimum Honor score required for that title. A player's title
  # is the highest threshold their current Honor meets or exceeds.
  tiers:
    -1000: Faithbroken
    0: Unproven
    500: Oathkeeper
    2000: Renowned
  # Real mechanical penalty applied to every party when a Blood Oath resolves BROKEN: a temporary
  # potion effect. Any valid Bukkit PotionEffectType name.
  blood-oath-breach-debuff-effect: WEAKNESS
  blood-oath-breach-debuff-duration-seconds: 300
  blood-oath-breach-debuff-amplifier: 1

notary:
  # Block that opens the named-party oath builder on right-click (prompts for the counterparty's
  # name in chat) - the "Sealing Table," an alternate face-to-face entry point to the same flow a
  # Notary NPC offers.
  sealing-table-material: LECTERN
  # Max named-party oaths a single player can have sitting PROPOSED (addressed to them) at once,
  # to prevent mailbox spam.
  pending-offer-cap-per-player: 10
  # Days a named-party oath can sit PROPOSED unanswered before it's automatically voided (neutral,
  # no Honor change - same as any other mutually-cancelled oath).
  negotiation-expiry-days: 7

oath-board:
  # Block that opens the Oath Board hub on right-click - browse recent witnessed activity, or bind
  # the board to a ProtectionGroup (regional) or unbind it (capital, shows everything).
  material: OAK_SIGN
  # How many of the most recent Ledger entries to scan when building a board's feed. Not a cap on
  # how many postings can show - just how far back the live query looks.
  feed-size: 50

bounty:
  # Notary fee for placing a bounty, before heat-scaling - separate from the reward itself.
  fee-base: 100
  # Fee multiplier per point of "heat" (how many active/recent bounties already exist on the target) -
  # fee = fee-base * (1 + heat * this). The first bounty on a target is cheap; stacking a fifth is not.
  heat-fee-multiplier: 0.5
  # Hours over which a bounty's contribution to a target's heat linearly decays to zero.
  heat-decay-hours: 72
  # Hard cap on bounties a single player can place in a rolling 24h window, independent of heat cost.
  max-placements-per-24h: 3
  # If the target broke an oath with the placer within this many days, the placer gets a fee discount -
  # approximated as "any oath between the pair transitioned to BROKEN in this window," since the Ledger
  # has no fault-attribution concept (same known limitation as the Honor system).
  breach-discount-window-days: 14
  # Fraction knocked off the fee when the discount above applies (0.5 = half price).
  breach-discount-fraction: 0.5
  # A group-bounty-targeted member counts as "abandoned" (auto-decrementing the contract's required
  # quantity by one) once their last-played time exceeds this many days.
  abandon-inactivity-days: 30

banishment:
  # Sentence length = bountyAmountPaid / this (hours), before the min/max clamp below.
  hours-per-currency-unit: 50
  min-hours: 1
  max-hours: 72
  # A subsequent qualifying bounty kill while already serving a sentence extends the remaining time
  # (never resets it), but the total duration measured from when the sentence first began can never
  # exceed this many hours - further stacking beyond the cap is absorbed.
  stack-cap-hours: 168
  # Fixed destination for the purpose-built End banishment pen - build it by hand (contained, safe from
  # Endermen/void, basic survival amenities), then run /oathbound-debug banishment set-pen while standing
  # at the release point to record these coordinates instead of editing them by hand.
  pen:
    world: world_the_end
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

# Standing, repeatable, admin-authored PvE kill contracts (an economy tap) - browsable from any Notary's
# Bounty Board. Reward currency must be one of economy.currencies. Player progress against these is real
# state and persists; the definitions themselves are just config and can be edited freely.
pve-contracts: []
# Example:
# pve-contracts:
#   - id: spider-cull
#     display-name: "Spider Cull"
#     mob: SPIDER
#     quantity: 20
#     reward:
#       coin: 200

# Ceremony Designer templates - bind a group-to-individual agreement with a tagged item and a
# right-click, no menus or commands. Give the item via
# /oathbound-debug ceremony give <templateId> <groupId> [player] - the group id is the liege
# ProtectionGroup territory reverts to, so the same template can be reused by any liege for any of
# their own groups. Right-clicking another player with the item speaks 'dialogue' to them; replying
# with one of 'confirm-phrases' seals and activates the oath immediately. The same item can instead be
# right-clicked onto an already-placed pressure plate or push/lever button to bind the ceremony there -
# any player who steps on/presses it afterwards is prompted as if the binder had right-clicked them, and
# the binder doesn't need to be online for the trigger to fire (only to seal it via chat afterwards).
#
# Ships with one live default, 'welcome-pact': a zero-mechanical-stakes onboarding pledge (no transfer,
# tribute, escrow, or diplomacy clause - just an RP-only custom flag) safe to hand to a new player via
# /oathbound-debug ceremony give welcome-pact <groupId> [player] without reviewing it first. Delete or
# edit it like any other entry; the commented-out 'fealty' example below shows a template with real
# stakes for admins who want more.
ceremony-templates:
  - id: welcome-pact
    display-name: "Welcome Pact"
    item-material: PAPER
    item-display-name: "Charter of Welcome"
    dialogue:
      - "{initiator} offers you a place among these lands, {target}."
      - "Swear only to keep the peace here - nothing more is asked of you."
      - "Do you accept?"
    confirm-phrases: ["i do", "yes", "i accept"]
    decline-phrases: ["no", "i decline"]
    prompt-timeout-seconds: 60
    blood-oath: false
    clauses:
      - type: custom-flag
        text: "Keep the peace of this land."

# Whether ceremony items can be bound to pressure plates/buttons at all (see above). Doesn't affect the
# existing right-click-a-player flow.
ceremony-block-triggers-enabled: true
# Example:
# ceremony-templates:
#   - id: fealty
#     display-name: "Oath of Fealty"
#     item-material: NETHERITE_SWORD
#     item-display-name: "Scepter of Avalon"
#     dialogue:
#       - "By this blade, {initiator} calls you to kneel, {target}."
#       - "Swear fealty: your land answers to the Crown should you fall in battle five times."
#       - "Swear tribute: wheat to Alaric, logs to Bryn."
#       - "Swear alliance: your house stands with the Crown against its enemies."
#       - "Swear a hunt: bring low the Ravager that haunts the eastern woods."
#       - "Do you agree?"
#     confirm-phrases: ["i do", "yes", "i swear it"]
#     decline-phrases: ["no", "i refuse"]
#     prompt-timeout-seconds: 60
#     blood-oath: false
#     clauses:
#       - type: transfer
#         pvp-death-count: 5
#       - type: tribute
#         recipient: Alaric
#         material: WHEAT
#         quantity: 64
#       - type: tribute
#         recipient: Bryn
#         material: OAK_LOG
#         quantity: 64
#       # Sets the diplomatic relation between the liege group (the "groupId" passed to
#       # /oathbound-debug ceremony give) and the target's own personally-owned territory group to
#       # ALLIANCE, the moment this oath activates. Both sides resolve to the root of their ownership
#       # chain, so this still lands correctly even if the target's own group is a minor vassal.
#       # Valid states: war, peace, alliance (not neutral - there's nothing to "declare" back to it).
#       - type: diplomacy
#         state: alliance
#       - type: mob-kill
#         mob: RAVAGER
#         quantity: 1

diplomacy:
  # Honor penalty applied to whoever declares war while the relation was PEACE or ALLIANCE (a backstab).
  # Declaring war from NEUTRAL (no prior relation) or from an existing WAR costs nothing. Diplomatic
  # authority always belongs to the most senior group in an ownership chain - a vassal's relations are
  # its liege's relations, all the way up.
  betrayal-honor-penalty: 20

pvp:
  # If true, two players can only deal PvP damage to each other when their groups' resolved root
  # relation is WAR. Players not in any group are always protected when this is on. Off by default so
  # existing/testing servers aren't surprised by PvP locking up before any kingdoms or wars exist.
  restrict-to-declared-wars: false

villagers:
  # Each role's shop NPCs all share one fixed buy/sell list, edited here - not a per-instance builder.
  # 'sells' = the NPC sells to the player (player pays, receives the item).
  # 'buys'  = the NPC buys from the player (player gives the item, receives currency).
  # Currency is always the server's default currency (economy.currencies, first entry). Roles left
  # with empty lists still install and open a (empty) shop menu - fill them in when ready.
  fisherman:
    sells:
      - {material: COD, price: 2}
      - {material: SALMON, price: 3}
      - {material: FISHING_ROD, price: 15}
    buys:
      - {material: TROPICAL_FISH, price: 1}
      - {material: PUFFERFISH, price: 1}
  mason:
    sells:
      - {material: BRICK, price: 1}
      - {material: STONE_BRICKS, price: 2}
      - {material: CHISELED_STONE_BRICKS, price: 4}
    buys:
      - {material: STONE, price: 1}
      - {material: COBBLESTONE, price: 1}
  farmer:
    sells:
      - {material: BREAD, price: 3}
      - {material: PUMPKIN_PIE, price: 5}
      - {material: BONE_MEAL, price: 2}
    buys:
      - {material: WHEAT, price: 1}
      - {material: CARROT, price: 1}
      - {material: POTATO, price: 1}
  librarian:
    sells:
      - {material: BOOK, price: 3}
      - {material: PAPER, price: 1}
      - {material: BOOKSHELF, price: 12}
    buys:
      - {material: WRITTEN_BOOK, price: 5}
  armorer:
    sells: []
    buys: []
  butcher:
    sells: []
    buys: []
  cartographer:
    sells: []
    buys: []
  cleric:
    sells: []
    buys: []
  fletcher:
    sells: []
    buys: []
  leatherworker:
    sells: []
    buys: []
  shepherd:
    sells: []
