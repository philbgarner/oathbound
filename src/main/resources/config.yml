# Oathbound configuration

persistence:
  # Path to the SQLite database file, relative to the plugin's data folder.
  sqlite-file: oathbound.db

ownership:
  # Max hops to walk when resolving a ProtectionGroup's owner chain before
  # failing safe and flagging the chain as unresolved.
  resolver-depth-cutoff: 10

economy:
  # Named currencies available on this server. The first entry is the default.
  currencies:
    - coin

escrow:
  # Days an escrow release sits unclaimed before it's returned to the depositor instead of the
  # recipient. Currency releases are unaffected - only unclaimed items expire.
  claim-expiry-days: 30

protection:
  # Item that must be held to lock/unlock a chest or door - right-click the block while holding
  # this item to open the group picker. Any other item (or empty hand) is a normal interaction,
  # gated by whatever ProtectionGroup the block is already locked to (if any).
  lock-tool-material: TRIPWIRE_HOOK

honor:
  # Honor gained by every party when an oath resolves FULFILLED, before severity/blood-oath scaling.
  fulfill-gain-base: 10
  # Honor lost by every party when an oath resolves BROKEN, before scaling. Kept larger than
  # fulfill-gain-base by default so breaking an oath stings more than fulfilling one rewards.
  breach-loss-base: 20
  # Both gain and loss are multiplied by this for Blood Oaths - "Blood Oaths matter more," both ways.
  blood-oath-multiplier: 2.0
  # Minimum current Honor required to swear a new Blood Oath. Default 0 only blocks players who've
  # already gone Honor-negative (i.e. broken oaths before) - a fresh player at 0 Honor is unaffected.
  min-honor-for-blood-oath: 0
  # Cosmetic title ladder, keyed by the minimum Honor score required for that title. A player's title
  # is the highest threshold their current Honor meets or exceeds.
  tiers:
    -1000: Faithbroken
    0: Unproven
    500: Oathkeeper
    2000: Renowned
  # Real mechanical penalty applied to every party when a Blood Oath resolves BROKEN: a temporary
  # potion effect. Any valid Bukkit PotionEffectType name.
  blood-oath-breach-debuff-effect: WEAKNESS
  blood-oath-breach-debuff-duration-seconds: 300
  blood-oath-breach-debuff-amplifier: 1

notary:
  # Block that opens the named-party oath builder on right-click (prompts for the counterparty's
  # name in chat) - the "Sealing Table," an alternate face-to-face entry point to the same flow a
  # Notary NPC offers.
  sealing-table-material: LECTERN
  # Max named-party oaths a single player can have sitting PROPOSED (addressed to them) at once,
  # to prevent mailbox spam. Kept as a backstop against many different senders; see
  # pending-offer-cap-per-sender-recipient below for the per-sender limit that actually stops one
  # player from filling this cap alone.
  pending-offer-cap-per-player: 10
  # Max named-party oaths a single sender can have sitting PROPOSED to the same recipient at once - a
  # single trivial no-stakes oath costs nothing to propose, so without this a lone sender could otherwise
  # use up the whole pending-offer-cap-per-player above by themselves and lock out every other sender.
  pending-offer-cap-per-sender-recipient: 2
  # Days a named-party oath can sit PROPOSED unanswered before it's automatically voided (neutral,
  # no Honor change - same as any other mutually-cancelled oath).
  negotiation-expiry-days: 7

oath-board:
  # Block that opens the Oath Board hub on right-click - browse recent witnessed activity, or bind
  # the board to a ProtectionGroup (regional) or unbind it (capital, shows everything).
  material: OAK_SIGN
  # How many of the most recent Ledger entries to scan when building a board's feed. Not a cap on
  # how many postings can show - just how far back the live query looks.
  feed-size: 50

# Ceremony Designer templates - bind a group-to-individual agreement with a tagged item and a
# right-click, no menus or commands. Give the item via
# /oathbound-debug ceremony give <templateId> <groupId> [player] - the group id is the liege
# ProtectionGroup territory reverts to, so the same template can be reused by any liege for any of
# their own groups. Right-clicking another player with the item speaks 'dialogue' to them, ending in a
# clickable [Accept]/[Decline] prompt that seals and activates the oath immediately on Accept - there is
# no free-text reply to configure or misfire. The same item can instead be right-clicked onto an
# already-placed pressure plate or push/lever button to bind the ceremony there - any player who steps
# on/presses it afterwards is prompted as if the binder had right-clicked them, and the binder doesn't
# need to be online for the trigger to fire (only to be online when the target clicks Accept).
#
# Ships with one live default, 'welcome-pact': a zero-mechanical-stakes onboarding pledge (no transfer,
# tribute, escrow, or diplomacy clause - just an RP-only custom flag) safe to hand to a new player via
# /oathbound-debug ceremony give welcome-pact <groupId> [player] without reviewing it first. Delete or
# edit it like any other entry; the commented-out 'fealty' example below shows a template with real
# stakes for admins who want more.
ceremony-templates:
  - id: welcome-pact
    display-name: "Welcome Pact"
    item-material: PAPER
    item-display-name: "Charter of Welcome"
    dialogue:
      - "{initiator} offers you a place among these lands, {target}."
      - "Swear only to keep the peace here - nothing more is asked of you."
      - "Do you accept?"
    prompt-timeout-seconds: 60
    blood-oath: false
    clauses:
      - type: custom-flag
        text: "Keep the peace of this land."

# Whether ceremony items can be bound to pressure plates/buttons at all (see above). Doesn't affect the
# existing right-click-a-player flow.
ceremony-block-triggers-enabled: true
# Example:
# ceremony-templates:
#   - id: fealty
#     display-name: "Oath of Fealty"
#     item-material: NETHERITE_SWORD
#     item-display-name: "Scepter of Avalon"
#     dialogue:
#       - "By this blade, {initiator} calls you to kneel, {target}."
#       - "Swear fealty: your land answers to the Crown should you fall in battle five times."
#       - "Swear tribute: wheat to Alaric, logs to Bryn."
#       - "Swear alliance: your house stands with the Crown against its enemies."
#       - "Swear a hunt: bring low the Ravager that haunts the eastern woods."
#       - "Do you agree?"
#     prompt-timeout-seconds: 60
#     blood-oath: false
#     clauses:
#       - type: transfer
#         pvp-death-count: 5
#       - type: tribute
#         recipient: Alaric
#         material: WHEAT
#         quantity: 64
#       - type: tribute
#         recipient: Bryn
#         material: OAK_LOG
#         quantity: 64
#       # Sets the diplomatic relation between the liege group (the "groupId" passed to
#       # /oathbound-debug ceremony give) and the target's own personally-owned territory group to
#       # ALLIANCE, the moment this oath activates. Both sides resolve to the root of their ownership
#       # chain, so this still lands correctly even if the target's own group is a minor vassal.
#       # Valid states: war, peace, alliance (not neutral - there's nothing to "declare" back to it).
#       - type: diplomacy
#         state: alliance
#       - type: mob-kill
#         mob: RAVAGER
#         quantity: 1

diplomacy:
  # Honor penalty applied to whoever declares war while the relation was PEACE or ALLIANCE (a backstab).
  # Declaring war from NEUTRAL (no prior relation) or from an existing WAR costs nothing. Diplomatic
  # authority always belongs to the most senior group in an ownership chain - a vassal's relations are
  # its liege's relations, all the way up.
  betrayal-honor-penalty: 20

pvp:
  # If true, two players can only deal PvP damage to each other when their groups' resolved root
  # relation is WAR. Players not in any group are always protected when this is on. On by default -
  # a sealed Peace/Alliance treaty (or simply never having declared war) should actually mean something
  # mechanically, not just cosmetically. Set to false to restore free-for-all PvP regardless of relations.
  restrict-to-declared-wars: true
